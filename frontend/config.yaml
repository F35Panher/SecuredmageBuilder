baseOs:
  - id: 'wolfi'
    name: 'Chainguard Wolfi'
    version: 'latest'
    source: 'cgr.dev/chainguard/wolfi-base'
    securityLevel: 'Minimal'
  - id: 'alpine'
    name: 'Alpine Linux'
    version: '3.18'
    source: 'alpine'
    securityLevel: 'Standard'
  - id: 'ubuntu'
    name: 'Ubuntu'
    version: '22.04'
    source: 'ubuntu'
    securityLevel: 'Full'
  - id: 'distroless-static'
    name: 'Distroless Static'
    version: 'latest'
    source: 'gcr.io/distroless/static-debian11'
    securityLevel: 'Minimal'

techStacks:
  - id: 'nodejs-20'
    name: 'Node.js (v20)'
  - id: 'python-3.11'
    name: 'Python (v3.11)'
  - id: 'golang-1.21'
    name: 'Go (v1.21)'
  - id: 'java-17'
    name: 'Java (v17)'

packages:
  - id: 'git'
    name: 'Git'
  - id: 'curl'
    name: 'cURL'
  - id: 'wget'
    name: 'Wget'
  - id: 'ca-certificates'
    name: 'CA Certificates'
  - id: 'build-base'
    name: 'Build Base'
  - id: 'openssl'
    name: 'OpenSSL'
  - id: 'zlib'
    name: 'zlib'

securityRules:
  - type: 'package'
    identifier: 'openssl'
    severity: 'High'
    deduction: 15
    message: 'OpenSSL is a high-risk package'
    reason: 'OpenSSL has a history of vulnerabilities.'
  - type: 'package'
    identifier: 'build-base'
    severity: 'Critical'
    deduction: 25
    message: 'Build Base should not be in production images'
    reason: 'Build tools increase the attack surface.'
  - type: 'baseOs'
    identifier: 'ubuntu'
    severity: 'Medium'
    deduction: 5
    message: 'Ubuntu is a large base image'
    reason: 'Larger base images increase the attack surface.'
  - type: 'techStack'
    identifier: 'java-17'
    severity: 'Low'
    deduction: 2
    message: 'Java 17 is not the latest LTS'
    reason: 'Consider using a more recent LTS version of Java.'